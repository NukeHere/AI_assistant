name: Telegram tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest tests.test_telegram_stickers tests.test_telegram_groups
